<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f6f3">
  <title>{% block titulo %}Fotos 360{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Papel y tinta: la página no compite con las fotos. Sin acento de color; el rojo solo avisa. */
    :root {
      --fondo: #f7f6f3;
      --superficie: #ffffff;
      --elevada: #efede8;
      --linea: #e2dfd8;
      --linea-fuerte: #c9c5bc;
      --texto: #1a1917;
      --suave: #5c5a55;
      --tenue: #8d8a83;
      --tinta: #1a1917;
      --sobre-tinta: #ffffff;
      --peligro: #b3261e;
      --ok: #2f6b3a;
      --radio: 4px;
      --radio-chico: 4px;
      --serif: "Newsreader", Georgia, serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--fondo); color: var(--texto);
      font: 400 15px/1.55 "Geist", system-ui, sans-serif; font-feature-settings: "tnum"; }
    a { color: inherit; }
    img { display: block; max-width: 100%; }
    svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6;
      stroke-linecap: round; stroke-linejoin: round; }

    .contenedor { max-width: 1180px; margin: 0 auto; padding: 0 20px 96px; }
    .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      height: 60px; margin-bottom: 40px; border-bottom: 1px solid var(--linea); }
    .marca { font-family: var(--serif); font-size: 1.2rem; font-weight: 500; text-decoration: none; letter-spacing: -.01em; }
    h1 { font-family: var(--serif); font-size: clamp(2rem, 5vw, 3.1rem); line-height: 1.05; font-weight: 400;
      margin: 0; letter-spacing: -.02em; }
    h2 { font-size: .8rem; font-weight: 500; margin: 48px 0 14px; color: var(--suave);
      text-transform: uppercase; letter-spacing: .08em; }
    .suave { color: var(--suave); }
    .tenue { color: var(--tenue); font-size: .85rem; }
    .meta { color: var(--suave); font-size: .9rem; margin: 10px 0 0; }

    /* Botones: rectángulos discretos; el principal en tinta. */
    .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px;
      padding: 0 16px; border-radius: var(--radio); border: 1px solid var(--linea-fuerte); background: var(--superficie);
      color: var(--texto); font: inherit; font-weight: 500; cursor: pointer; text-decoration: none;
      transition: background .12s, border-color .12s; white-space: nowrap; }
    .boton:hover { border-color: var(--texto); }
    .boton.primario { background: var(--tinta); border-color: var(--tinta); color: var(--sobre-tinta); }
    .boton.primario:hover { background: #3a3835; }
    .boton.fantasma { background: transparent; border-color: transparent; color: var(--suave); }
    .boton.fantasma:hover { color: var(--texto); }
    .boton.peligro { color: var(--peligro); }
    .boton.peligro:hover { border-color: var(--peligro); }
    .boton.icono { width: 40px; padding: 0; }
    .boton:focus-visible, .chip:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 2px solid var(--texto); outline-offset: 2px; }

    input[type=text], input[type=password], textarea { width: 100%; min-height: 42px; padding: 9px 12px;
      border: 1px solid var(--linea-fuerte); border-radius: var(--radio); background: var(--superficie); color: var(--texto);
      font: inherit; }
    input:focus, textarea:focus { border-color: var(--texto); outline: none; }
    textarea { min-height: 80px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: var(--tenue); }

    .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--radio);
      border: 1px solid var(--linea-fuerte); background: transparent; color: var(--suave); font: inherit; font-size: .88rem;
      cursor: pointer; white-space: nowrap; }
    .chip[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--sobre-tinta); }

    /* Grilla de fotos: la imagen manda, el texto va debajo y en chico. */
    .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px 16px; }
    .tarjeta { position: relative; display: block; color: inherit; text-decoration: none; }
    .tarjeta .foto { aspect-ratio: 2 / 1; width: 100%; object-fit: cover; background: var(--elevada);
      border-radius: 2px; transition: opacity .15s; }
    .tarjeta a:hover .foto, a.tarjeta:hover .foto { opacity: .88; }
    .tarjeta .pie { padding-top: 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .tarjeta .pie strong { display: block; font-weight: 500; line-height: 1.3; }
    .numero { color: var(--tenue); font-size: .8rem; }

    .panel { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); padding: 20px; }
    .avisos { list-style: none; padding: 0; margin: 20px 0; }
    .avisos li { padding: 10px 14px; border: 1px solid var(--linea-fuerte); border-radius: var(--radio); background: var(--superficie); }
    @media (max-width: 560px) { .contenedor { padding: 0 16px 72px; } .cabecera { margin-bottom: 28px; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-atras" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-adelante" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-bajar" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-subir" viewBox="0 0 24 24"><path d="M12 20V9M7 13.5l5-5 5 5M5 4h14"/></symbol>
  <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-completa" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-contraer" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
  <symbol id="i-camara" viewBox="0 0 24 24"><path d="M4 8.5h3l1.8-2.5h6.4L17 8.5h3V19H4z"/><circle cx="12" cy="13.5" r="3.4"/></symbol>
  <symbol id="i-normal" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="2.5"/></symbol>
  <symbol id="i-angular" viewBox="0 0 24 24"><path d="M2.5 12c3.2-5.5 15.8-5.5 19 0-3.2 5.5-15.8 5.5-19 0z"/><circle cx="12" cy="12" r="2.4"/></symbol>
  <symbol id="i-planeta" viewBox="0 0 24 24"><circle cx="12" cy="15" r="5"/><path d="M12 10V4M8.5 11.5L5 7M15.5 11.5L19 7"/></symbol>
  <symbol id="i-bola" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M7 15.5c3 2 7 2 10 0"/></symbol>
  <symbol id="i-recto" viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M9.5 9h5M9.5 15h5"/></symbol>
  <symbol id="i-mover" viewBox="0 0 24 24"><rect x="7.5" y="3" width="9" height="18" rx="2"/><path d="M3 9c-1 2-1 4 0 6M21 9c1 2 1 4 0 6"/></symbol>
  <symbol id="i-horizontal" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/></symbol>
  <symbol id="i-vertical" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/></symbol>
  <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-basura" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="i-enlace" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-mensaje" viewBox="0 0 24 24"><path d="M4 18.5l1.3-3.6A7.5 7.5 0 1 1 8.8 18z"/></symbol>
  <symbol id="i-ojo" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-salir" viewBox="0 0 24 24"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></symbol>
  <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
</svg>
{% block cuerpo %}
  <div class="contenedor">
    {% if messages %}<ul class="avisos">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
    {% block contenido %}{% endblock %}
  </div>
{% endblock %}
</body>
</html>
