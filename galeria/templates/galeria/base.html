<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#161618">
  <title>{% block titulo %}Fotos 360{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Grafito cálido con un solo acento ámbar (la luz del visor): el color marca lo importante. */
    :root {
      --fondo: #161618;
      --superficie: #212124;
      --elevada: #2b2b2f;
      --linea: #36363b;
      --texto: #f2efe8;
      --suave: #a3a09a;
      --tenue: #6f6d69;
      --ambar: #f4b740;
      --ambar-hondo: #d99a1e;
      --sobre-ambar: #1b1609;
      --peligro: #ef7d6b;
      --ok: #9fd08a;
      --radio: 18px;
      --radio-chico: 12px;
      --sombra: 0 10px 30px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--fondo); color: var(--texto);
      font: 400 16px/1.55 "Lexend", system-ui, sans-serif; letter-spacing: -.005em; }
    a { color: var(--ambar); text-decoration: none; }
    img { display: block; max-width: 100%; }
    svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; }

    .contenedor { max-width: 1120px; margin: 0 auto; padding: 22px 16px 80px; }
    .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 26px; }
    .marca { display: inline-flex; align-items: center; gap: 10px; color: var(--texto); font-weight: 600; }
    .marca .punto { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      background: var(--ambar); color: var(--sobre-ambar); font-size: 11px; font-weight: 700; letter-spacing: -.02em; }
    h1 { font-size: clamp(1.6rem, 4.2vw, 2.3rem); line-height: 1.15; font-weight: 600; margin: 0; letter-spacing: -.02em; }
    h2 { font-size: 1.05rem; font-weight: 500; margin: 34px 0 14px; color: var(--suave); }
    .suave { color: var(--suave); font-size: .92rem; }
    .tenue { color: var(--tenue); font-size: .85rem; }

    /* Botones */
    .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
      padding: 0 18px; border-radius: 999px; border: 1px solid var(--linea); background: var(--elevada);
      color: var(--texto); font: inherit; font-size: .95rem; font-weight: 500; cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
    .boton:hover { border-color: #4a4a50; background: #323237; }
    .boton:active { transform: scale(.97); }
    .boton.primario { background: var(--ambar); border-color: var(--ambar); color: var(--sobre-ambar); font-weight: 600; }
    .boton.primario:hover { background: #f7c45f; }
    .boton.fantasma { background: transparent; }
    .boton.peligro { color: var(--peligro); }
    .boton.icono { width: 44px; padding: 0; }
    .boton:focus-visible, .chip:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--ambar); outline-offset: 2px; }

    input[type=text], input[type=password], textarea { width: 100%; min-height: 48px; padding: 12px 18px;
      border: 1px solid var(--linea); border-radius: 999px; background: var(--superficie); color: var(--texto);
      font: inherit; }
    textarea { border-radius: var(--radio-chico); min-height: 80px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: var(--tenue); }

    .chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--linea); background: transparent; color: var(--suave); font: inherit; font-size: .88rem;
      cursor: pointer; white-space: nowrap; }
    .chip[aria-pressed="true"] { background: var(--ambar); border-color: var(--ambar); color: var(--sobre-ambar); font-weight: 600; }

    /* Tarjetas de foto / álbum */
    .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .tarjeta { position: relative; display: block; background: var(--superficie); border-radius: var(--radio);
      overflow: hidden; color: inherit; transition: transform .2s ease, box-shadow .2s ease; }
    .tarjeta:hover { transform: translateY(-3px); box-shadow: var(--sombra); }
    .tarjeta .foto { aspect-ratio: 2 / 1; width: 100%; object-fit: cover; background: var(--elevada); }
    .tarjeta .pie { padding: 12px 14px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .tarjeta .pie strong { display: block; font-weight: 500; line-height: 1.3; }
    .insignia { position: absolute; top: 10px; left: 10px; padding: 3px 9px; border-radius: 999px;
      background: rgba(22, 22, 24, .72); color: var(--texto); font-size: .72rem; font-weight: 500; backdrop-filter: blur(6px); }

    .panel { background: var(--superficie); border-radius: var(--radio); padding: 18px; }
    .avisos { list-style: none; padding: 0; margin: 0 0 18px; }
    .avisos li { padding: 12px 16px; border-radius: var(--radio-chico); background: var(--elevada); border-left: 3px solid var(--ambar); }

    /* Entrada escalonada */
    @keyframes subir { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .aparece > * { animation: subir .45s cubic-bezier(.2, .7, .2, 1) both; }
    .aparece > *:nth-child(2) { animation-delay: .05s; }
    .aparece > *:nth-child(3) { animation-delay: .1s; }
    .aparece > *:nth-child(4) { animation-delay: .15s; }
    .aparece > *:nth-child(5) { animation-delay: .2s; }
    .aparece > *:nth-child(n+6) { animation-delay: .25s; }
    @media (prefers-reduced-motion: reduce) { .aparece > * { animation: none; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-horizontal" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/></symbol>
  <symbol id="i-vertical" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/></symbol>
  <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-basura" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="i-enlace" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>

  <symbol id="i-salir" viewBox="0 0 24 24"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></symbol>
  <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
</svg>
{% block cuerpo %}
  <div class="contenedor">
    {% if messages %}<ul class="avisos">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
    {% block contenido %}{% endblock %}
  </div>
{% endblock %}
</body>
</html>
