{% extends "galeria/base.html" %}
{% block titulo %}Entrar · Fotos 360{% endblock %}
{% block contenido %}
<div style="max-width:360px;margin:12vh auto 0">
  <h1 style="font-size:1.3rem;font-weight:600">Fotos 360</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<p style="color:var(--peligro)">Usuario o clave incorrectos.</p>{% endif %}
    <p><input type="text" name="username" placeholder="Usuario" autofocus autocomplete="username" required></p>
    <p><input type="password" name="password" placeholder="Clave" autocomplete="current-password" required></p>
    <button class="primario" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
