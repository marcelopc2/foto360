{% extends "galeria/base.html" %}
{% block titulo %}Entrar · Fotos 360{% endblock %}
{% block head %}
<style>
  .entrar { min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; }
  .entrar .caja { width: 100%; max-width: 340px; }
  .entrar h1 { font-size: 2.2rem; margin: 0 0 28px; }
  .entrar form { display: grid; gap: 10px; }
  .entrar label { font-size: .85rem; color: var(--suave); margin-top: 6px; }
  .entrar .error { color: var(--peligro); font-size: .9rem; margin: 0 0 6px; }
</style>
{% endblock %}
{% block cuerpo %}
<main class="entrar">
  <div class="caja">
    <h1>Fotos 360</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}<p class="error">Usuario o clave incorrectos.</p>{% endif %}
      <label for="u">Usuario</label>
      <input type="text" id="u" name="username" autofocus autocomplete="username" required>
      <label for="c">Clave</label>
      <input type="password" id="c" name="password" autocomplete="current-password" required>
      <button class="boton primario" type="submit" style="margin-top:14px">Entrar</button>
    </form>
  </div>
</main>
{% endblock %}
